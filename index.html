<!doctype html>
<html lang="en">
  <head>
    <title>Lily Chan</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,200..800;1,200..800&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet" />
    <style>
      body {
        background-image: url(assets/stars.jpg);
        background-attachment: fixed;
        background-size: cover;
      }

      main {
        width: 100%;
        margin: auto;
        top: 220px;
        position: absolute;
      }

      @media screen and (max-width: 600px) {
        main {
          width: 85%;
          margin: auto;
          position: relative;
          top: 220px;
          left: 0px;
          text-align: center;
        }
      }
      @font-face {
        font-family: "AcroterionJF";
        src: url(/assets/fonts/AcroterionJF.otf);
      }

      .title {
        font-family: AcroterionJF;
        color: white;
        text-align: center;
        font-size: 86px;
        -webkit-text-stroke: 1px white;
        text-stroke: 1px white;
        font-weight: 400;
        font-style: normal;
        letter-spacing: 0.5px;
        text-shadow: 0px 0px 10px #ffffffb3;
        line-height: 20px;
      }

      .globe {
        text-align: center;
        z-index: 2;
      }

      .globe img {
        height: 300px;
        width: 300px;
        filter: drop-shadow(0px 0px 10px white);
      }

      .enter {
        font-family: Arial, Helvetica, sans-serif;
        color: white;
        text-align: center;
        font-size: 24px;
        font-weight: 900;
        position: relative;
        top: 20px;
      }

      .enter a {
        color: white;
        text-underline-offset: 6px;
      }

      .enter a:hover {
        color: #9dff00;
      }

      /* cr koiwaprimevera */

      #pop {
        -webkit-animation: pop 1.5s ease-in-out infinite alternate;
        animation: pop 1.5s ease-in-out infinite alternate;
        -moz-animation: pop 1.5s ease-in-out infinite alternate;
      }

      @keyframes pop {
        from {
          transform: scale(0.95);
        }

        50% {
          transform: scale(1.3);
        }

        to {
          transform: scale(0.95);
        }
      }

      @-webkit-keyframes pop {
        from {
          -webkit-transform: scale(0.95);
        }

        50% {
          -webkit-transform: scale(1.3);
        }

        to {
          -webkit-transform: scale(0.95);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="title">Lily's World</div>
      <div class="globe">
        <img src="/assets/globe.gif" alt="spinning globe" />
      </div>
      <div class="enter" id="pop"><a href="home.html">enter</a></div>
    </main>
  </body>
</html>
